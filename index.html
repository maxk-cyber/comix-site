<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Comix Library</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    :root { --ink:#0b0908; --paper:#efe3cf; --bg:#120405; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; color: var(--paper);
      font-family: "Courier Prime", monospace;
      background:
        radial-gradient(1200px 600px at 10% -10%, #5b2a8644, transparent),
        radial-gradient(900px 500px at 100% 0%, #a30f1944, transparent),
        var(--bg);
    }
    header {
      padding: 48px 24px 24px; max-width: 960px; margin: 0 auto;
    }
    header h1 {
      font-family: Anton, Impact, sans-serif; font-size: clamp(40px, 10vw, 72px);
      letter-spacing: .04em; margin: 0 0 8px; text-transform: uppercase;
    }
    header p { margin: 0; opacity: .85; max-width: 40rem; }
    .grid {
      max-width: 960px; margin: 0 auto; padding: 12px 24px 64px;
      display: grid; gap: 16px;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    }
    .card {
      display: flex; flex-direction: column; gap: 8px;
      text-decoration: none; color: var(--ink); background: var(--paper);
      border: 3px solid var(--ink); box-shadow: 6px 6px 0 var(--ink);
      padding: 18px 16px; transition: transform .15s ease, box-shadow .15s ease;
    }
    .card:hover { transform: translate(-2px, -2px); box-shadow: 8px 8px 0 var(--ink); }
    .card h2 { font-family: Anton, Impact, sans-serif; margin: 0; font-size: 26px; letter-spacing: .03em; }
    .card p { margin: 0; font-size: 14px; line-height: 1.35; flex: 1; }
    .card span { font-weight: 700; font-size: 13px; }
    .empty { opacity: .7; }
    footer { max-width: 960px; margin: 0 auto; padding: 0 24px 40px; opacity: .55; font-size: 12px; }
  </style>
</head>
<body>
  <header>
    <h1>Comix</h1>
    <p>Pick a comic. Desktop and mobile layouts are built into each story.</p>
  </header>
  <main class="grid">
<a class="card theme-toxic" href="comics/freud-jung.html"><h2>Freud &amp; Jung on Love, War, Freedom, and Self</h2><p>Two depth psychologists, four giant questions — and why they stopped sharing a lab coat.</p><span>Read →</span></a>
  </main>
  <footer>https://maxk-cyber.github.io/comix-site/</footer>
</body>
</html>
